name: Phase 12B.5 exact cross-platform acceptance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12b5-acceptance-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  exact-native:
    name: Exact GNSS-loss evidence / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025-vs2026
            rust_host: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            rust_host: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Verify pinned toolchain and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          actual_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "${actual_host}" = "${{ matrix.rust_host }}"

      - name: Reproduce the accepted full mission
        run: >-
          cargo test -p ksa64-host --lib --locked
          phase12b_live::tests::scripted_full_mission_seals_exact_evidence_and_succeeds
          -- --ignored --exact

      - name: Preserve inactive Phase 10 behavior
        run: >-
          cargo test -p ksa64-sim --lib --features fixtures --locked
          phase10_avionics::tests::inactive_reference_package_matches_frozen_phase10_full_mission_exactly
          -- --ignored --exact
