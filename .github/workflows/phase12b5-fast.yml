name: Phase 12B.5 fast portability

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12b5-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025-vs2026
            rust_host: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            runner: macos-15
            rust_host: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Verify pinned toolchain and runner architecture
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          actual_host="$(rustc -vV | sed -n 's/^host: //p')"
          test "${actual_host}" = "${{ matrix.rust_host }}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features fixtures --locked -- -D warnings

      - name: Native workspace tests
        run: cargo test --workspace --features fixtures --locked

      - name: Broker security, reconnect, and portable authority tests
        run: cargo test -p ksa64-session-broker --all-features --locked

      - name: Bridge library and contained panic tests
        run: cargo test -p ksa64-viewer-bridge --lib --profile viewer --features panic-probe --locked

      - name: Portable native bridge harness
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pwsh -NoProfile -File viewer-bridge/harness/build.ps1 -PanicProbe
          else
            sh viewer-bridge/harness/build.sh --panic-probe
          fi

      - name: Full exact bridge mission
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            pwsh -NoProfile -File viewer-bridge/harness/build-full.ps1
          else
            sh viewer-bridge/harness/build.sh --full
          fi

      - name: Build checksum-qualified engineering archive (Windows)
        if: github.event_name != 'pull_request' && runner.os == 'Windows'
        shell: pwsh
        run: ./phase12/package-native.ps1

      - name: Build checksum-qualified engineering archive (Unix)
        if: github.event_name != 'pull_request' && runner.os != 'Windows'
        shell: bash
        run: sh ./phase12/package-native.sh

      - name: Upload engineering archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ksa64-phase12b5-${{ matrix.name }}
          path: dist/phase12b5/*
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: Browser-safe Rust session and presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Install the pinned WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Check portable session without native services
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p ksa64-session --no-default-features
          --target wasm32-unknown-unknown

      - name: Check no_std presentation protocol
        env:
          RUSTFLAGS: -D warnings
        run: >-
          cargo check --locked -p ksa64-presentation --no-default-features --target wasm32-unknown-unknown

      - name: Build exported browser authority
        run: cargo build -p ksa64-session-wasm --target wasm32-unknown-unknown --release --locked

      - name: Prove exact local-WASM mission evidence
        run: node session-wasm/tools/harness.mjs target/wasm32-unknown-unknown/release/ksa64_session_wasm.wasm

  vita-host-fixture:
    name: Vita bounded client host fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Test bounded Vita client
        run: cargo test --manifest-path vita/Cargo.toml -p ksa64-vita-client --all-targets --locked

      - name: Lint bounded Vita client
        run: cargo clippy --manifest-path vita/Cargo.toml -p ksa64-vita-client --all-targets --locked -- -D warnings

      - name: Exercise host presentation fixture
        run: cargo run --manifest-path vita/Cargo.toml -p ksa64-vita-client --bin vita-fixture --locked --quiet
  web:
    name: Web lockfile, tests, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify committed web lockfile
        shell: bash
        run: test -f web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web

      - name: Run web tests
        run: npm test --prefix web

      - name: Build self-hosted web product
        run: npm run build --prefix web
