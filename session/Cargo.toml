[package]
name = "ksa64-session"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ksa64-core = { path = "../core" }
ksa64-flight = { path = "../flight" }
ksa64-interface = { path = "../interface" }
ksa64-presentation = { path = "../presentation" }
ksa64-sim = { path = "../sim", features = ["fixtures"] }
crc32fast = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["native"]
native = []

[[example]]
name = "exact_gnss_loss"
path = "examples/exact_gnss_loss.rs"
required-features = ["native"]
