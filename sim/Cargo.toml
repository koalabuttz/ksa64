[package]
name = "ksa64-sim"
version = "0.1.0"
edition = "2021"
publish = false

[features]
fixtures = ["ksa64-core/fixtures"]
sim = ["fixtures"]
c64 = ["fixtures", "ksa64-core/c64"]

[dependencies]
ksa64-core = { path = "../core" }
ksa64-flight = { path = "../flight" }
ksa64-interface = { path = "../interface" }

[[bin]]
name = "ksa64-phase3-probes-c64"
path = "src/bin/phase3_probes_c64.rs"
required-features = ["c64"]
[[bin]]
name = "ksa64-phase3-replay-c64"
path = "src/bin/phase3_replay_c64.rs"
required-features = ["c64"]
[[bin]]
name = "ksa64-phase4-distribution-sim"
path = "src/bin/phase4_distribution_sim.rs"
required-features = ["sim"]
[[bin]]
name = "ksa64-phase4-campaign-sim"
path = "src/bin/phase4_campaign_sim.rs"
required-features = ["sim"]
