[package]
name = "ksa64-phase0-rust"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
c64 = []
sim = []

[[bin]]
name = "ksa64-phase0-rust-c64"
path = "src/c64_main.rs"
required-features = ["c64"]

[[bin]]
name = "ksa64-phase0-rust-manual-c64"
path = "src/manual_c64_main.rs"
required-features = ["c64"]

[[bin]]
name = "ksa64-phase0-rust-vertical-c64"
path = "src/vertical_c64_main.rs"
required-features = ["c64"]

[[bin]]
name = "ksa64-phase0-rust-vertical-optimized-c64"
path = "src/vertical_optimized_c64_main.rs"
required-features = ["c64"]

[[bin]]
name = "ksa64-phase0-rust-vertical-timed-c64"
path = "src/vertical_timed_c64_main.rs"
required-features = ["c64"]
[[bin]]
name = "ksa64-phase0-rust-primitive-timed-c64"
path = "src/primitive_timed_c64_main.rs"
required-features = ["c64"]

[[bin]]
name = "ksa64-phase0-rust-sim"
path = "src/sim_main.rs"
required-features = ["sim"]

[[bin]]
name = "ksa64-phase0-rust-manual-sim"
path = "src/manual_sim_main.rs"
required-features = ["sim"]

[[bin]]
name = "ksa64-phase0-rust-vertical-sim"
path = "src/vertical_sim_main.rs"
required-features = ["sim"]

[[bin]]
name = "ksa64-phase0-rust-vertical-optimized-sim"
path = "src/vertical_optimized_sim_main.rs"
required-features = ["sim"]

[[bin]]
name = "ksa64-phase0-rust-vertical-kernel-sim"
path = "src/vertical_kernel_sim_main.rs"
required-features = ["sim"]

[[bin]]
name = "ksa64-phase0-rust-vertical-kernel-optimized-sim"
path = "src/vertical_kernel_optimized_sim_main.rs"
required-features = ["sim"]

[profile.release]
opt-level = 2
lto = true
panic = "abort"